name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  create:
  workflow_dispatch:

jobs:

  debug:
    name: Debug
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3

  rutest:
    name: Test Rust
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - run: cargo check
      - run: cargo check --features lsp
      - run: cargo test

  pytest:
    name: Test Python
    needs: rutest
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        py: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install and test
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest' }}
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          python -m pip install --upgrade pip
          pip install -r goldpy/requirements.txt
          maturin develop -m goldpy/Cargo.toml
          pytest goldpy/test

      - name: Install and test (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          python -m venv venv
          venv/Scripts/Activate.ps1
          Write-Host "VIRTUAL_ENV: $env:VIRTUAL_ENV"
          python -m pip install --upgrade pip
          pip install -r goldpy/requirements.txt
          maturin develop -m goldpy/Cargo.toml
          pytest goldpy/test

  pytest-ref:
    name: Test Python reference
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5

      - run: make test
        working-directory: ref

  build-lsp:
    name: Build LSP
    needs: [rutest, pytest, pytest-ref]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  vscode_target: linux-x64    }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, vscode_target: linux-arm64, use_cross: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,      vscode_target: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    vscode_target: win32-x64    }
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        if: ${{ matrix.use_cross == true }}
        with:
          tool: cross

      - name: Build
        if: ${{ matrix.use_cross != true }}
        run: cargo build --release -p gold --features lsp --bin gold-lsp --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use_cross == true }}
        run: cross build --release -p gold --features lsp --bin gold-lsp --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gold-lsp-${{ matrix.vscode_target }}
          path: target/${{ matrix.target }}/release/gold-lsp${{ matrix.vscode_target == 'win32-x64' && '.exe' || '' }}

  build-vscode:
    name: Package VS Code extension
    needs: build-lsp
    strategy:
      matrix:
        include:
          - { vscode_target: linux-x64,    binary: gold-lsp     }
          - { vscode_target: linux-arm64,  binary: gold-lsp     }
          - { vscode_target: darwin-arm64, binary: gold-lsp     }
          - { vscode_target: win32-x64,    binary: gold-lsp.exe }
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download LSP binary
        uses: actions/download-artifact@v4
        with:
          name: gold-lsp-${{ matrix.vscode_target }}
          path: contrib/vscode-gold/bin

      - name: Make binary executable
        if: ${{ matrix.vscode_target != 'win32-x64' }}
        run: chmod +x contrib/vscode-gold/bin/gold-lsp

      - name: Install dependencies
        working-directory: contrib/vscode-gold
        run: npm ci

      - name: Package extension
        working-directory: contrib/vscode-gold
        run: npx @vscode/vsce package --target ${{ matrix.vscode_target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: goldlang-${{ matrix.vscode_target }}
          path: contrib/vscode-gold/*.vsix

  build-wheels:
    name: Build wheels
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [pytest, pytest-ref, rutest]
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          manylinux: auto
          rust-toolchain: nightly
          command: build
          args: --release -o dist -m goldpy/Cargo.toml --interpreter python${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          manylinux: auto
          rust-toolchain: nightly
          command: build
          args: --release -o dist -m goldpy/Cargo.toml --interpreter python${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          manylinux: auto
          rust-toolchain: nightly
          command: build
          args: --release -o dist -m goldpy/Cargo.toml --interpreter python${{ matrix.python }}
          target: universal2-apple-darwin

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: ./dist/*.whl

  deploy:
    name: Deploy
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/')
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/goldpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test-deploy:
    name: Test Deploy
    if: github.event_name == 'workflow_dispatch'
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi-test
      url: https://test.pypi.org/p/goldpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
