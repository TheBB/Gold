[package]
name = "gold"
version = "3.0.3"
edition = "2021"

[features]
python = ["dep:pyo3"]
lsp = ["dep:tower-lsp", "dep:tokio"]

[dependencies]
clap = { version = "4.0.18", features = ["derive"] }
gc = { version = "0.5.0", features = ["derive", "serde"] }
indexmap = { version = "1.9.2", features = ["serde"] }
json = "0.12.4"
lazy_static = "1.4.0"
nom = "7.1.1"
nom_locate = "4.0.0"
num-bigint = { version = "0.4.3", features = ["serde"] }
num-traits = "0.2.15"
pyo3 = { version = "0.28.2", optional = true, features = ["num-bigint"]}
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tower-lsp = { version = "0.20", optional = true }
regex = "1.7.0"
rmp-serde = "1.1.1"
serde = { version = "1.0.147", features = ["rc", "serde_derive"] }
symbol_table = { version = "0.3.0", features = ["global", "serde"] }

[[bin]]
name = "gold-lsp"
path = "src/bin/gold-lsp.rs"
required-features = ["lsp"]

[dev-dependencies]
libtest-mimic = "0.7"

[[test]]
name = "eval_fixtures"
harness = false

[[test]]
name = "parse_fixtures"
harness = false
